name: CMS download test

# One-time test: can GitHub's servers download the CMS public use files?
# Started by hand from the Actions tab. The result decides whether full CI
# (rerunning dbt build and the tests on every push) gets built.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and unzip the five CMS files
        run: |
          failed=0
          for f in 2026/rate-puf 2026/plan-attributes-puf 2027/rate-puf 2027/plan-attributes-puf 2027/plan-id-crosswalk-puf; do
            year="${f%%/*}"
            mkdir -p "data/raw/$year"
            url="https://download.cms.gov/marketplace-puf/$f.zip"
            echo "::group::$url"
            if curl -fsSL --retry 3 --retry-delay 5 -o /tmp/download.zip \
                 -w "HTTP %{http_code}, %{size_download} bytes in %{time_total}s\n" "$url"; then
              unzip -o -q /tmp/download.zip -d "data/raw/$year"
            else
              echo "FAILED: $url"
              failed=1
            fi
            echo "::endgroup::"
          done
          echo "Files after unzipping:"
          ls -la data/raw/2026 data/raw/2027
          exit $failed
